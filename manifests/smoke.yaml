apiVersion: v1
kind: Namespace
metadata:
  name: agro-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke
  namespace: agro-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke
  template:
    metadata:
      labels:
        app: smoke
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: docker.io/rancher/mirrored-library-busybox:1.37.0@sha256:101b4afd76732482eff9b95cae5f94bcf295e521fbec4e01b69c5421f3f3f3e5
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - printf 'agro-kubernetes\n' > /www/index.html && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: content
              mountPath: /www
      volumes:
        - name: content
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smoke
  namespace: agro-lab
spec:
  type: NodePort
  selector:
    app: smoke
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
