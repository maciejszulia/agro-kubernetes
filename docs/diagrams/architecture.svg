<text x="738" y="118.5" fill="#111111">2 vCPUs, 1024 MiB RAM</text>
<text x="738" y="135.5" fill="#111111">in the app sandbox</text>
<rect x="16" y="186" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="207" fill="#111111" font-weight="bold">Kernel build</text>
