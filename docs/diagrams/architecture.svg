<text x="24" y="93" fill="#111111" font-weight="bold">T470p (Linux)</text>
<text x="24" y="110" fill="#111111">management host:</text>
<text x="24" y="127" fill="#111111">ADB, OpenSSH, Python</text>
<text x="24" y="144" fill="#111111">scripts and tests</text>
<rect x="254" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="101.5" fill="#111111" font-weight="bold">USB + ADB forward</text>
<text x="262" y="118.5" fill="#111111">key-only SSH</text>
<text x="262" y="135.5" fill="#111111">into Termux</text>
<rect x="492" y="72" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="101.5" fill="#111111" font-weight="bold">Xperia H3113 no. 1</text>
<text x="500" y="118.5" fill="#111111">Android 9, unrooted,</text>
