<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 497" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="A T470p drives two unrooted Xperia phones over ADB and SSH. QEMU runs an Alpine guest on phone 1; K3s starts, but check-config reports 3 missing kernel options.">
