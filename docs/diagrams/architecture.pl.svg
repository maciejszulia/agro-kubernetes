<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 497" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="T470p steruje 2 telefonami Xperia bez roota przez ADB i SSH. QEMU uruchamia gościa Alpine na telefonie 1; K3s startuje, ale check-config zgłasza brak 3 opcji jądra.">
